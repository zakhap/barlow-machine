<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarence Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Graphite and off-white, hairlines, no color. Value matters more than hue. */
:root{
  --bg:#131312; --body:#191918; --panel:#1d1d1c; --well:#161615; --rule:#2a2a28; --rule2:#383835;
  --ink:#ecebe6; --ink2:#bab9b3; --dim:#7a7974; --faint:#4b4a46;
  --v0:#f2f1ec; --v1:#c9c7c0; --v2:#a3a19a; --v3:#ded5c4; --v4:#bcc2c7; --v5:#8c8a84; --v6:#d4cfc5; --v7:#a3a8ad;
  --sans:"Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --cap:500 9.5px/1 var(--sans);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:300 13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
::selection{background:var(--ink);color:var(--bg)}

/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;padding:18px 28px;background:var(--body);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;margin-right:8px}
.brand b{font:500 11px/1 var(--sans);letter-spacing:.42em;text-transform:uppercase;color:var(--ink)}
.grp{display:flex;gap:14px;align-items:center}
.vsep{width:1px;align-self:stretch;background:var(--rule)}
.btn{background:transparent;border:1px solid var(--rule2);border-radius:2px;padding:6px 11px;cursor:pointer;white-space:nowrap;font:var(--cap);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.btn:hover{color:var(--ink);border-color:var(--dim)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
#play{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;padding:0;border-color:var(--ink2);color:var(--ink)}
#play.on{background:var(--ink);color:var(--bg)}
.hold{width:52px;height:52px;border-radius:2px;display:grid;place-items:center;user-select:none;touch-action:none}
.scenes{display:grid;grid-template-columns:repeat(4,24px);gap:6px}
.scene{width:24px;height:24px;border-radius:50%;border:1px solid var(--rule2);background:transparent;color:var(--faint);font:400 10px var(--mono);cursor:pointer;padding:0}
.scene.full{border-color:var(--dim);color:var(--ink2)}
.scene.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.scene.pending{animation:blink .3s steps(2) infinite}
@keyframes blink{50%{background:transparent;color:var(--ink)}}
.slab{font:var(--cap);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);writing-mode:vertical-rl;transform:rotate(180deg)}
select{background:transparent;border:1px solid var(--rule2);border-radius:2px;padding:5px 6px;color:var(--ink2);max-width:180px;font:400 11px var(--sans)}
select option{background:var(--body);color:var(--ink)}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;align-items:center}

/* ---------- value lists ---------- */
.screen{background:transparent;border-left:1px solid var(--rule);padding:2px 0 2px 16px;display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-content:center}
.screen.one{grid-template-columns:1fr;min-width:150px}
.prm{display:flex;justify-content:space-between;gap:12px;font:300 11.5px/1.85 var(--sans);cursor:pointer;user-select:none;touch-action:none;white-space:nowrap;border-bottom:1px solid transparent}
.prm.enum{cursor:pointer}
.pl{color:var(--dim)}
.pv{font:400 11px/1.75 var(--mono);color:var(--faint)}
.prm.lit .pv{color:var(--ink)}
.prm:hover{border-bottom-color:var(--rule)}
.prm:hover .pl{color:var(--ink2)}
.prm:hover .pv{color:var(--ink2)}
.prm.lit:hover .pv{color:#fff}
.grid3,.grid2{display:grid;gap:0 26px}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gcol{min-width:0}
.gcol h5{margin:0 0 4px;font:var(--cap);font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.gscreen{min-width:150px;align-self:flex-start}
.gscreen .gcol{min-width:150px}

/* ---------- selector popover ---------- */
.pop{position:absolute;z-index:50;background:#222221;border:1px solid var(--rule2);border-radius:3px;padding:12px;width:220px;box-shadow:0 16px 48px rgba(0,0,0,.55)}
.popT{font:var(--cap);letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.popList{display:flex;flex-direction:column;max-height:260px;overflow:auto;margin:0 -6px}
.popList .popOpt{text-align:left;border:0;border-radius:0;padding:6px;font:300 12px var(--sans)}
.popList .popOpt:hover{background:#2c2c2a}
.popGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.popOpt{background:transparent;border:1px solid var(--rule2);border-radius:2px;color:var(--ink2);font:400 10.5px var(--mono);padding:6px 4px;cursor:pointer;white-space:nowrap}
.popOpt:hover{border-color:var(--dim);color:var(--ink)}
.popOpt.on,.popList .popOpt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.popVal{font:300 22px/1 var(--sans);color:var(--ink);margin-bottom:10px}
.pop input[type=range]{width:100%;margin:0 0 12px;accent-color:var(--ink)}
.popFoot{display:flex;gap:6px;margin-top:10px}
.popFoot input{flex:1;min-width:0;background:var(--well);border:1px solid var(--rule2);border-radius:2px;color:var(--ink);font:400 11px var(--mono);padding:5px 6px}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(380px,1fr) minmax(720px,800px);gap:28px;padding:28px;align-items:start}
.bloomWrap{position:sticky;top:28px;aspect-ratio:1;width:100%;border-radius:50%;background:var(--well);box-shadow:inset 0 0 0 1px var(--rule)}
#bloom{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;border-radius:50%}
.bloomHint{position:absolute;left:0;right:0;bottom:-26px;text-align:center;color:var(--faint);font:var(--cap);letter-spacing:.16em;text-transform:uppercase;pointer-events:none}
.rack{display:flex;flex-direction:column;gap:18px}

/* ---------- strips ---------- */
.dev,.panel{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:16px 18px 18px;position:relative}
.dev::before{content:"";position:absolute;left:-1px;top:16px;bottom:16px;width:2px;background:var(--vc)}
.dev.muted{opacity:.4}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ptitle{display:flex;align-items:baseline;gap:14px;margin:0 0 14px}
.ptitle.sub{margin-top:22px}
.panel.voices{padding:14px 18px}
.panel.voices .ptitle{margin:0;align-items:center}
.ptitle h2{margin:0;font:500 10px var(--sans);letter-spacing:.36em;text-transform:uppercase;color:var(--ink)}
.rack > .ptitle{margin:10px 0 -4px}
.hint{color:var(--faint);font:300 11.5px var(--sans)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper .btn{width:26px;height:26px;padding:0;border-radius:50%;font:300 14px/1 var(--sans);letter-spacing:0}
#countVal{font:300 20px var(--sans);color:var(--ink);min-width:30px;text-align:center}
.instGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.icard{background:var(--panel);padding:14px 14px 14px 16px;position:relative}
.icard::before{content:"";position:absolute;left:0;top:14px;width:2px;height:22px;background:var(--vc)}
.icard.unused{opacity:.4}
.ihead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.badge{width:22px;height:22px;border-radius:50%;border:1px solid var(--vc);background:transparent;color:var(--vc);font:400 10px var(--mono);cursor:pointer;flex:none;transition:box-shadow .05s}
.sname{background:none;border:0;padding:0 2px;color:var(--dim);font:400 10px var(--mono);cursor:pointer;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname:hover{color:var(--ink)}
.icard.drop{outline:1px dashed var(--ink2);outline-offset:-4px}
.usedby{flex:1;text-align:right;color:var(--faint);font:400 10px var(--mono);letter-spacing:.06em}

.patch{display:grid;gap:6px;align-items:center;justify-content:start}
.pcorner{font:var(--cap);color:var(--faint)}
.phead{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0}
.phead b{font:400 11px var(--mono)}
.ptype{font:var(--cap);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.prow{font:400 10px var(--mono);color:var(--dim)}
.cell{width:34px;height:22px;border:0;background:transparent;cursor:pointer;position:relative}
.cell::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule)}
.cell::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--rule2)}
.cell.on::after{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;background:var(--vc)}
.cell:hover::after{background:var(--dim)}
.rhythms{display:flex;flex-direction:column;gap:18px}
.rlabel{font:400 11px var(--mono);color:var(--ink)}
.arrow{color:var(--faint);font:var(--cap);letter-spacing:.14em;text-transform:uppercase}
.plays{display:flex;gap:4px}
.ichip{width:20px;height:20px;border-radius:50%;border:1px solid var(--rule2);background:transparent;color:var(--faint);font:400 9.5px var(--mono);cursor:pointer;padding:0}
.ichip:hover{color:var(--ink2);border-color:var(--dim)}
.ichip.on{background:var(--ic);border-color:var(--ic);color:var(--bg)}
.playsName,select.inst{font:400 11px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--vc)}
.playsName{margin-left:6px}
select.inst{background:transparent;border:0;appearance:none;-webkit-appearance:none;cursor:pointer;padding:0 2px;max-width:none}
select.inst option{text-transform:none;letter-spacing:0}
.readout{flex:1;color:var(--faint);font:400 10px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;padding-right:6px}
.dhead .btn{padding:0;width:22px;height:22px;border-radius:50%;letter-spacing:0;font:400 9.5px var(--mono)}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) 156px;gap:26px;align-items:center}
.fan{width:156px;height:156px;display:block;touch-action:none;cursor:pointer;border-radius:50%;background:var(--well);box-shadow:inset 0 0 0 1px var(--rule)}
.dfoot{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:280px}
.chip{border:1px solid var(--rule2);background:transparent;border-radius:999px;padding:3px 10px;cursor:pointer;font:400 10px var(--mono);color:var(--dim)}
.chip:hover{color:var(--ink2)}
.chip.on{border-color:var(--ink);color:var(--ink)}
.chip.ghost{border-style:dashed}
.tree{width:100%;height:92px;display:block;cursor:pointer}

footer{padding:24px 28px 48px;color:var(--dim);max-width:980px;font:300 12px/1.8 var(--sans)}
footer b{color:var(--ink2);font-weight:500}
kbd{border:1px solid var(--rule2);border-radius:2px;padding:0 5px;font:400 10px var(--mono);color:var(--ink2)}

/* ---------- perform mode ---------- */
body.perform .rack, body.perform footer{display:none}
body.perform .stage{grid-template-columns:1fr}
body.perform .bloomWrap{position:relative;top:0;width:min(100%,calc(100vh - 220px));margin:0 auto}

@media (max-width:1400px){
  .stage{grid-template-columns:1fr}
  .bloomWrap{position:relative;top:0;max-width:600px;margin:0 auto 20px}
}
@media (max-width:820px){
  .top{padding:14px 16px;gap:14px 18px}.stage{padding:16px}footer{padding:16px 16px 32px}
  .dbody{grid-template-columns:1fr}
  .grid3,.grid2{grid-template-columns:1fr}
  .gcol + .gcol{margin-top:10px}
  .fan{margin:0 auto}
  .dfoot{grid-template-columns:1fr}
  .instGrid{grid-template-columns:1fr}
  .slab{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="none" stroke="#ecebe6" stroke-width="1"/><line x1="9" y1="9" x2="9" y2="2.5" stroke="#ecebe6" stroke-width="1.4" stroke-linecap="round"/></svg>
    <b>Clarence Machine</b>
  </div>
  <div class="vsep"></div>
  <div class="grp">
    <button class="btn" id="play" title="Start or stop. Space.">Play</button>
  </div>
  <div class="vsep"></div>
  <div class="gscreen" id="timeScreen"></div>
  <div class="vsep"></div>
  <div class="grp">
    <button class="btn hold" id="fillBtn" title="Hold for more hits and ratchets. F.">FILL</button>
    <button class="btn hold" id="dropBtn" title="Hold to cut every rhythm to its strongest step. D.">DROP</button>
  </div>
  <div class="vsep"></div>
  <div class="grp">
    <span class="slab">Scenes</span>
    <div class="scenes" id="scenes"></div>
  </div>
  <div class="vsep"></div>
  <div class="gscreen" id="mixScreen"></div>
  <div class="vsep"></div>
  <div class="col">
    <div class="row">
      <select id="presets"></select>
      <button class="btn" id="undo" title="Undo. ⌘Z.">↶</button>
      <button class="btn" id="redo" title="Redo. ⇧⌘Z.">↷</button>
      <button class="btn" id="mutateAll" title="Randomize every rhythm.">Mutate</button>
    </div>
    <div class="row">
      <button class="btn" id="save" title="Save as a preset in this browser.">Save</button>
      <button class="btn" id="share" title="Copy a link to this exact state.">Copy link</button>
      <button class="btn" id="bounce" title="Render 4 cycles to a WAV file.">Bounce WAV</button>
      <button class="btn" id="midiFile" title="Export 4 cycles as a MIDI file.">MIDI file</button>
    </div>
  </div>
  <div class="col">
    <div class="row">
      <button class="btn" id="midiBtn" title="Send notes to a MIDI device.">MIDI out</button>
      <select id="midiOut" hidden></select>
      <button class="btn on" id="synthBtn" title="Turn the built-in sound on or off.">Synth</button>
    </div>
    <div class="row"><button class="btn" id="performBtn" title="Show only the Bloom. P.">Perform</button></div>
  </div>
</header>

<div class="stage">
  <div class="bloomWrap"><canvas id="bloom" title="Click a step to flip it. Drag out for density, around to rotate."></canvas></div>
  <div class="rack">
    <section class="panel voices">
      <div class="ptitle">
        <h2>Voices</h2>
        <div class="stepper">
          <button class="btn" id="countDown" title="Remove the last rhythm and instrument.">−</button><span id="countVal">4</span><button class="btn" id="countUp" title="Add a rhythm and an instrument.">+</button>
        </div>
        
      </div>
    </section>
    <div class="ptitle"><h2>Rhythms</h2></div>
    <div class="rhythms" id="rhythms"></div>
    <section class="panel">
      <div class="ptitle"><h2>Instruments</h2></div>
      <div class="instGrid" id="instGrid"></div>
      <div class="ptitle sub"><h2>Patch</h2></div>
      <div class="patch" id="patch"></div>
    </section>
  </div>
</div>

<footer>
  <kbd>Space</kbd> play · <kbd>F</kbd> fill · <kbd>D</kbd> drop · <kbd>[</kbd><kbd>]</kbd> energy · <kbd>1</kbd>–<kbd>8</kbd> scene · <kbd>⇧1</kbd>–<kbd>⇧8</kbd> store · <kbd>Q</kbd>–<kbd>I</kbd> mute · <kbd>P</kbd> perform · <kbd>⌘Z</kbd> undo
</footer>

<script>
"use strict";
const TAU = Math.PI * 2;
const mod = (a, n) => ((a % n) + n) % n;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const $ = id => document.getElementById(id);
function el(tag, props = {}, html) { const e = document.createElement(tag); Object.assign(e, props); if (html !== undefined) e.innerHTML = html; return e; }

// ================= Barlow indispensability =================
function primeFactors(n) { const f = []; for (let d = 2; n > 1; d++) while (n % d === 0) { f.push(d); n /= d; } return f; }
const basicCache = {};
// 2 and 3 are Barlow's tables; larger primes group 2+2+…+3 and rank recursively (gives ψ5 = 4 0 3 1 2).
function basicPrime(p) {
  if (basicCache[p]) return basicCache[p];
  let r;
  if (p === 1) r = [0];
  else if (p === 2) r = [1, 0];
  else if (p === 3) r = [2, 0, 1];
  else { const g = (p - 1) / 2, sizes = Array(g).fill(2); sizes[g - 1] = 3; r = subdivide(meterRaw(primeFactors(g)), sizes); }
  return (basicCache[p] = r);
}
// Coarse pulses keep their order on top; new sub-pulses rank by position in their group,
// then by the weight of the coarse pulse they anticipate.
function subdivide(coarse, sizes) {
  const Nc = coarse.length, N = sizes.reduce((a, b) => a + b, 0), out = new Array(N), rest = [];
  let pos = 0;
  for (let m = 0; m < Nc; m++) {
    const s = sizes[m], bp = basicPrime(s);
    out[pos] = coarse[m] + (N - Nc);
    for (let j = 1; j < s; j++) rest.push({ i: pos + j, a: bp[j], b: coarse[(m + 1) % Nc] });
    pos += s;
  }
  rest.sort((x, y) => x.a - y.a || x.b - y.b || x.i - y.i);
  rest.forEach((e, k) => (out[e.i] = k));
  return out;
}
function meterRaw(factors) {
  if (!factors.length) return [0];
  let w = basicPrime(factors[0]).slice();
  for (let L = 1; L < factors.length; L++) w = subdivide(w, Array(w.length).fill(factors[L]));
  return w;
}
function permutations(arr) {
  const seen = new Set(), out = [];
  (function rec(a, rest) {
    if (!rest.length) { const k = a.join("·"); if (!seen.has(k)) { seen.add(k); out.push(a.slice()); } return; }
    for (let i = 0; i < rest.length; i++) rec([...a, rest[i]], rest.filter((_, j) => j !== i));
  })([], arr);
  return out;
}

// ================= Instruments =================
// Drums are modal: a few sine modes at the body's resonant ratios, each with its own decay and a short
// pitch drop, struck by a filtered noise exciter. Strokes change damping and exciter, not just volume.
const DECAY = {
  kick: d => 0.15 + d * 0.9, sub: d => 0.12 + d * 1.1, conga: d => 0.12 + d * 0.7, bongo: d => 0.08 + d * 0.4,
  snare: d => 0.08 + d * 0.35, clave: d => 0.02 + d * 0.16, cowbell: d => 0.05 + d * 0.45,
  hat: d => 0.02 + d * 0.12, shaker: d => 0.03 + d * 0.18, sample: d => 0.05 + d * 1.95,
};
const INST_NOTE = { kick: 33, sub: 33, conga: 57, bongo: 64, snare: 62, clave: 93, cowbell: 80, hat: 104, shaker: 100, sample: 60 };

function env(p, t, a, peak, d) {
  p.setValueAtTime(0.0001, t);
  p.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
  p.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function osc(G, type, t, dur) { const o = G.ctx.createOscillator(); o.type = type; o.start(t); o.stop(t + dur + 0.05); return o; }
function noise(G, t, dur) { const s = G.ctx.createBufferSource(); s.buffer = G.noise; s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.05); return s; }
function filt(G, type, f, q) { const b = G.ctx.createBiquadFilter(); b.type = type; b.frequency.value = Math.min(f, 18000); b.Q.value = q; return b; }
const amp = G => G.ctx.createGain();

// one resonant mode: a sine that drops `bend` in pitch over 40ms and rings for `dec` seconds
function mode(G, t, f, peak, dec, bend, out) {
  const o = osc(G, "sine", t, dec), g = amp(G);
  o.frequency.setValueAtTime(f * (1 + bend), t);
  o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
  env(g.gain, t, 0.0015, peak, dec);
  o.connect(g).connect(out);
}
// a noise burst through a band-pass: the stick, hand or bead hitting the body
function strike(G, t, f, q, peak, dec, out) {
  const n = noise(G, t, dec + 0.02), b = filt(G, "bandpass", f, q), g = amp(G);
  env(g.gain, t, 0.0008, peak, dec);
  n.connect(b).connect(g).connect(out);
}
// circular membrane modes (Bessel zeros relative to the fundamental) and their relative strengths
const MEMBRANE = [[1, 1], [1.594, 0.55], [2.136, 0.38], [2.296, 0.3], [2.653, 0.22], [2.918, 0.14]];
// free wooden bar modes
const BAR = [[1, 1], [2.756, 0.35], [5.404, 0.12]];

function hand(G, t, f, vel, len, tone, out, stroke) {

// ================= Value rows and selectors =================

const pop = el("div", { className: "pop" });

document.addEventListener("pointerdown", e => { if (popOwner && !pop.contains(e.target) && !popOwner.contains(e.target)) closePop(); }, true);

function openPop(row, o, put) {
  if (popOwner === row) return closePop();
  closePop();
  pop.innerHTML = "";
  pop.append(el("div", { className: "popT", textContent: o.label }));
  const cur = o.get(), show = x => (o.fmt ? o.fmt(x) : x);
  const choice = (label, x, on, keepOpen) => {
    const b = el("button", { className: "popOpt" + (on ? " on" : ""), textContent: label });

  };
  if (o.type === "enum") {
    const list = el("div", { className: "popList" });

    pop.append(list);
  } else {
    const max = val(o.max), n = Math.round((max - o.min) / o.step) + 1;
    if (n <= 17) {
      const grid = el("div", { className: "popGrid" });
      for (let i = 0; i < n; i++) { const x = quant(o, o.min + i * o.step); grid.append(choice(show(x), x, Math.abs(x - cur) < 1e-9)); }
      pop.append(grid);

      const field = el("input", { type: "number", min: o.min, max, step: o.step, value: cur });
      const refresh = () => { const x = o.get(); big.textContent = show(x); slider.value = x; if (document.activeElement !== field) field.value = x; };
      slider.oninput = () => { put(quant(o, +slider.value)); refresh(); };
      field.onchange = () => { put(quant(o, +field.value)); refresh(); };
      field.onkeydown = e => { if (e.key === "Enter") { field.onchange(); closePop(); } };
      pop.append(big, slider);
      if (o.min === 0 && max === 1) {
        const quick = el("div", { className: "popGrid" });

function makeParam(o) {
  const row = el("div", { className: "prm " + o.type, title: o.title || "" }, `<span class="pl">${o.label}</span><span class="pv"></span>`), pv = row.querySelector(".pv");
  function update() {
    const v = o.get();
    pv.textContent = o.type === "enum" ? (o.opts.find(x => x[0] === v) || [, String(v)])[1] : o.fmt ? o.fmt(v) : v;
    row.classList.toggle("lit", v !== val(o.def));
  }
  const put = v => { o.set(v); update(); };
  const optIndex = () => Math.max(0, o.opts.findIndex(x => x[0] === o.get()));
  let drag = null;
  row.addEventListener("pointerdown", e => {
    if (e.button) return;

  });

    if (st.mode === "density") v.density = clamp(st.d0 + rad / (st.R * 0.7), 0, 1);
    else {
      const a = Math.atan2(e.clientY - st.cy, e.clientX - st.cx);

  }, { passive: false });

  const breathe = 1 + 0.012 * kEnv * S.duck * 3;
  for (let ri = 0; ri < n; ri++) {
    const r0 = (band0 + ri * bw + bw * 0.08) * breathe, r1 = (band0 + (ri + 1) * bw - bw * 0.08) * breathe;
    drawPetals(g, ri, cx, cy, r0, r1, d, now, { gap: 0.1, tails: false, outline: 0.1, flare: 10, halo: true, lw: n > 5 ? 0.7 : 1 });
    chalkRing(g, cx, cy, r0 - 2.5 * d, d, audible(S.rhythms[ri]) ? 0.55 : 0.2, 0.8);
    // a custom-length rhythm gets its own playhead across its band
    const v = S.rhythms[ri];
    if (v.length) {
      const pa = phaseOf(v, now) * TAU - Math.PI / 2;
      g.strokeStyle = COLORS[v.inst]; g.lineWidth = 2 * d;
      g.beginPath(); g.moveTo(cx + Math.cos(pa) * r0, cy + Math.sin(pa) * r0); g.lineTo(cx + Math.cos(pa) * r1, cy + Math.sin(pa) * r1); g.stroke();
    }
  }
  g.strokeStyle = playing ? "rgba(236,235,230,0.55)" : "rgba(236,235,230,0.15)"; g.lineWidth = 1.3 * d;
  g.beginPath(); g.moveTo(cx + Math.cos(a) * band0, cy + Math.sin(a) * band0); g.lineTo(cx + Math.cos(a) * (R + 10 * d), cy + Math.sin(a) * (R + 10 * d)); g.stroke();
  // hub: the polyrhythm signature, each number in the color of the instrument it plays
  g.fillStyle = WELL; g.beginPath(); g.arc(cx, cy, band0 * 0.86, 0, TAU); g.fill();
  g.textBaseline = "middle"; g.textAlign = "left";
  const big = Math.max(11, Math.min(30, band0 / d / (1.2 + n * 0.55))) * d;
  g.font = `300 ${big}px "Inter", sans-serif`;
  const parts = []; S.rhythms.forEach((v, ri) => { if (ri) parts.push([":", "#4b4a46"]); parts.push([v.steps + (v.length ? "'" : ""), audible(v) ? COLORS[v.inst] : "#4b4a46"]); });
  const tw = parts.reduce((s, [t]) => s + g.measureText(t).width, 0);
  let x = cx - tw / 2;
  for (const [t, col] of parts) { g.fillStyle = col; g.fillText(t, x, cy - big * 0.15); x += g.measureText(t).width; }
  g.textAlign = "center"; g.font = `500 ${Math.max(9 * d, big * 0.36)}px "IBM Plex Mono", monospace`;
  g.fillStyle = perf.fill || perf.drop ? "#ecebe6" : "#7a7974";
  g.fillText(perf.fill ? "FILL" : perf.drop ? "DROP" : `energy ${PCT(S.energy)}`, cx, cy + big * 0.7);
}

function frame() {
  const lat = ac ? ac.outputLatency || ac.baseLatency || 0 : 0, now = ac ? ac.currentTime - lat : 0;
  const showRack = !document.body.classList.contains("perform");
  if (instDirty) { instDirty = false; syncInstruments(); }
  // instrument badges flash when their instrument sounds
  instUI.forEach((u, ii) => {
    if (!u || ii >= count()) return;
    const h = instHits[ii], k = h && now >= h.t ? Math.exp(-(now - h.t) / 0.12) * h.vel : 0;
    u.badge.style.boxShadow = k > 0.02 ? `0 0 ${4 + 14 * k}px ${COLORS[ii]}` : "";
  });
  S.rhythms.forEach((_, ri) => {
    const r = RT[ri];
    if (r.dirty) { r.dirty = false; syncRhythmUI(ri); }
    animate(ri);
    if (showRack) { drawFan(ri, now); drawTree(ri, now); }
  });
  drawBloom(now);
  requestAnimationFrame(frame);
}

// ================= Boot =================
(function boot() {
  const cs = getComputedStyle(document.documentElement);
  COLORS = [...Array(MAX).keys()].map(i => cs.getPropertyValue(`--v${i}`).trim());
  SLATE = cs.getPropertyValue("--panel").trim();
  WELL = cs.getPropertyValue("--well").trim();
  let st = null;
  if (location.hash.length > 1) { try { st = decodeState(location.hash.slice(1)); } catch (e) { console.warn("Ignoring bad state in URL", e); } }
  S = sanitize(st || presetState(DEFAULT_PRESET));
  recomputeAll();
  applyPatterns();
  ensureSamples();
  buildGlobal();
  buildRack();
  fillPresets();
  pushHistory();
  requestAnimationFrame(frame);
})();
</script>
